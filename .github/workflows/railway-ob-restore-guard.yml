name: Railway OB restored overlay guard

on:
  push:
    branches:
      - fix/railway-restore-overlay-guard
  pull_request:
    paths:
      - railway_restore_entrypoint.sh
      - Dockerfile.railway-restore
      - tests/test_railway_restore_entrypoint.py
      - .github/workflows/railway-ob-restore-guard.yml

permissions:
  contents: read

jobs:
  restore-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate entrypoint syntax
        run: sh -n railway_restore_entrypoint.sh
      - name: Verify migration fail-closed modes (synthetic only)
        run: python3 -B -m unittest discover -s tests -p test_railway_restore_entrypoint.py -v
